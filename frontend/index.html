    <script>
      // Giao diện tối chỉ có ở các trang dùng AuthLayout (đăng nhập, đăng ký, quên/đặt
      // lại mật khẩu, lời mời admin) và chỉ khi người dùng đã tự chọn
      // (use-consented-color-scheme.js). Không suy từ giao diện hệ điều hành: trang
      // khác chỉ có nền sáng, `.dark` sót lại làm popup đăng nhập chữ trắng trên nền trắng.
      (function () {
        var authPage = /^(\/admin)?(\/app)?\/(login|sign-up|register|forgot-password|reset-password|invitation)\/?$/
          .test(window.location.pathname)
        document.documentElement.classList.toggle('dark', authPage && localStorage.getItem('color-scheme') === 'dark')
      })()
    </script>
