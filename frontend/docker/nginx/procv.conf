# ProCV production — một domain, ba cổng theo đường dẫn (/, /tuyendung, /admin).
#
# Cloudflare (proxied, SSL Full strict) -> :443 ở đây. Route SEO, /api, /r và
# robots/sitemap đi về Django để crawler nhận meta, JSON-LD và mã 404/410 thật;
# mọi đường dẫn còn lại là SPA. Danh sách route SEO phải khớp từng mẫu trong
# backend/config/urls.py và backend/apps/*/seo/urls.py: thêm route SEO mới ở
# Django thì thêm ở đây, nếu không Nginx sẽ trả thẳng index.html.

include /etc/nginx/snippets/cloudflare-realip.conf;

# DNS nội bộ của Docker. `resolve` trong upstream hỏi lại tên service mỗi 10 giây:
# deploy tạo lại container backend/realtime với IP mới thì nginx theo kịp, không
# trả 502 tới khi web cũng bị khởi động lại. (nginx >= 1.27.3; cần `zone`.)
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream procv_backend {
    zone procv_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

# WebSocket thông báo (daphne, apps.realtime); HTTP vẫn ở gunicorn phía trên.
upstream procv_realtime {
    zone procv_realtime 64k;
    server realtime:8001 resolve;
}

# Authenticated Origin Pulls: chỉ Cloudflare (trình chứng chỉ client do CA của
# Cloudflare ký) được vào cổng 443; gọi thẳng IP VPS bị 403. Ngoại lệ duy nhất
# là chính máy chủ (deploy.sh gọi thử qua 127.0.0.1 -> docker-proxy, địa chỉ
# nguồn là gateway của mạng procv). Xét địa chỉ peer thật ($realip_remote_addr),
# không phải IP khách mà module realip lấy từ header Cloudflare. Xem snippets/origin-pull.conf.
# Gateway tùy bản Docker: cũ lấy .1 của subnet, Docker 29 lấy địa chỉ đầu của
# ip_range (172.28.0.128, docker-compose.prod.yml). Không container nào nhận được
# hai địa chỉ này, nên miễn trừ cả hai không mở thêm đường vào.
geo $realip_remote_addr $origin_pull_local {
    default      0;
    127.0.0.1    1;
    172.28.0.1   1;
    172.28.0.128 1;
}
map "$ssl_client_verify:$origin_pull_local" $origin_pull_denied {
    default      1;
    ~^SUCCESS:   0;
    ~:1$         0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
# Asset SPA đã được nén sẵn mức 9 lúc build (scripts/precompress-dist.mjs):
# gửi thẳng file .gz. Phản hồi động (API JSON, SEO shell) nén mức 5 thay cho
# mặc định 1.
gzip_static on;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml
           application/xml text/xml text/plain application/manifest+json;

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://procv.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.procv.site;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    include /etc/nginx/snippets/origin-pull.conf;
    return 301 https://procv.site$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name procv.site;

    # Cloudflare Origin Certificate (mount từ deploy/certs, không commit).
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    include /etc/nginx/snippets/origin-pull.conf;

    root /usr/share/nginx/procv;

    # Backend/realtime không trả lời (đang deploy, sập): trang bảo trì tĩnh thay vì
    # trang lỗi mặc định của nginx. Chỉ lỗi do nginx sinh ra — 503 của Django
    # (ví dụ /api/health/ready/) đi thẳng tới client vì không bật intercept.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/errors;
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    # Upload CV/ảnh/tài liệu: UPLOAD_MAX_BYTES (25 MB) + phần multipart.
    client_max_body_size 26m;

    # Tệp ẩn (.vite/manifest.json lộ sơ đồ mã nguồn, .env, .git nếu lỡ lọt vào
    # dist) không bao giờ được phục vụ; chừa .well-known cho chuẩn web.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ---- WebSocket thông báo: chỉ đúng route consumer, không phải mọi /ws ----
    location = /ws/notifications/ {
        proxy_pass http://procv_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Client gửi ping mỗi 25 giây (dưới ngưỡng idle 100 giây của Cloudflare);
        # quá 75 giây không có gì là kết nối đã chết, đóng để client nối lại.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # ---- Django: API, link theo dõi, robots/sitemap ----
    location /api/ {
        include /etc/nginx/snippets/proxy-backend.conf;
        # Client API nhận JSON thay vì trang HTML bảo trì.
        error_page 502 503 504 = @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '{"detail":"Hệ thống đang bảo trì, vui lòng thử lại sau ít phút.","code":"service_unavailable"}';
    }
    location ~ ^/r/[A-Za-z0-9]+(/[A-Za-z0-9_-]+)?$ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }
    location = /robots.txt  { include /etc/nginx/snippets/proxy-backend.conf; }
    location = /sitemap.xml { include /etc/nginx/snippets/proxy-backend.conf; }
    location ~ ^/sitemaps/[-\w]+\.xml$ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # ---- Django: SEO shell (HTML có meta của từng trang) ----
    location = / { include /etc/nginx/snippets/proxy-seo.conf; }
    location = /chinh-sach-cookie { include /etc/nginx/snippets/proxy-seo.conf; }
    # apps/jobs/seo/urls.py
    location ~ ^/viec-lam(/tai/[-\w]+|/[-\w]+)?$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    location = /viec-lam-gan-ban { include /etc/nginx/snippets/proxy-seo.conf; }
    location ~ ^/brand/[-\w]+/tuyen-dung/[-\w]+$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    # apps/sitecontent/seo/urls.py + apps/employers/seo/urls.py
    location ~ ^/cong-ty(/?|/tim-kiem/?|/[-\w]+)$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    location ~ ^/tuyendung(/(gioi-thieu|dich-vu|lien-he|dieu-khoan-dich-vu|chinh-sach-quyen-rieng))?$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    # apps/blog/seo/urls.py
    location ~ ^/blog(/danh-muc/[-\w]+|/[-\w]+)?$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    # apps/knowledgebase/seo/urls.py
    location ~ "^/tro-giup(/[-\w]+){0,2}$" {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    # apps/cv_templates/seo/urls.py (gồm redirect 301 của kho Nhật/Trung đã gỡ)
    location ~ ^/(mau-cv(-tieng-anh)?(/chi-tiet/[^/]+|/[^/]+)?|(mau-cv-tieng-(nhat|trung)|mau-cv/ngon-ngu/[^/]+)(/chi-tiet)?(/[^/]+)?|cv-templates(/[-\w]+)?)$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }
    # apps/campaigns/seo/urls.py
    location ~ ^/tuyen-dung/[-\w]+$ {
        include /etc/nginx/snippets/proxy-seo.conf;
    }

    # ---- SPA ----
    # Vite đặt hash vào tên file trong /assets: cache vĩnh viễn.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Ảnh tĩnh trong frontend/public/images (logo, banner, mascot): tên file không
    # có hash nên chỉ cache 1 ngày — đổi ảnh thì tối đa một ngày sau người dùng thấy.
    location ^~ /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    # mime.types của nginx chưa có .webmanifest (mặc định octet-stream).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /cv-print.html {
        # Chỉ worker xuất PDF dùng, qua cổng nội bộ 8080.
        return 404;
    }
    # Trình duyệt/crawler tự hỏi /favicon.ico, /llms.txt, /apple-touch-icon-*.png…:
    # file tĩnh không có thì trả 404 thật, không rơi xuống index.html với mã 200
    # (soft 404, crawler nhận HTML ở chỗ chờ ảnh/text). Route SPA không có đuôi file.
    # Regex thắng location tiền tố `/api/` nên phải chừa /api/ (tệp PDF/JSON từ Django).
    location = /favicon.ico {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files /favicon-32.png =404;
    }
    location ~* ^/(?!api/).*\.(?:ico|png|jpe?g|gif|webp|avif|svg|txt|json|xml|js|mjs|css|map|woff2?|ttf|pdf|mp3|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        charset utf-8;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Cổng nội bộ (không publish ra host): Django lấy SEO shell tại
# FRONTEND_SHELL_URL=http://web:8080/ và Chromium của worker mở
# CV_PRINT_URL=http://web:8080/cv-print.html. Không proxy gì về Django ở đây để
# tránh vòng lặp `/` -> Django -> `/`.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/procv;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    # FRONTEND_SHELL_URL trỏ vào `/`: trả index.html (không cần thư mục index).
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
