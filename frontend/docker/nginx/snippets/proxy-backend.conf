# Chuyển request về Django (gunicorn). Host giữ nguyên để Django dựng canonical
# URL và kiểm ALLOWED_HOSTS. X-Forwarded-For chỉ chứa IP client thật (sau
# real_ip của Cloudflare): Django tin đúng một hop từ IP của container web
# (TRUSTED_PROXY_IPS, TRUSTED_PROXY_HOPS=1), không nối chuỗi client tự gửi.
proxy_pass http://procv_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
# Sinh tin tuyển dụng bằng AI giữ lease 85 giây; gunicorn timeout 90.
proxy_read_timeout 95s;
proxy_send_timeout 95s;
