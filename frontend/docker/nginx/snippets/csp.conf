# Content-Security-Policy cho mọi trang HTML (SPA tĩnh + SEO shell do Django dựng).
# Phản hồi /api/ đã có CSP riêng `default-src 'none'` từ Django.
#
# Đang ở chế độ Report-Only: rehearsal mở đủ ba cổng, xem console không còn vi
# phạm rồi đổi tên header thành `Content-Security-Policy` để bắt đầu chặn
# (docs/06-deployment/huong-dan-deployment.md, mục kiểm tra sau deploy).
#
# - script-src: bundle cùng origin + reCAPTCHA + beacon Cloudflare Web Analytics
#   (Cloudflare tự chèn); hash là script chọn giao diện sáng/tối inline trong
#   frontend/index.html — sửa script đó phải tính lại hash, test
#   src/app/csp-inline-script-hash.test.js báo lỗi nếu quên. 'report-sample' kèm
#   40 ký tự đầu của script bị chặn trong báo cáo để biết script inline nào.
# - style-src 'unsafe-inline': antd sinh CSS-in-JS lúc chạy.
# - img/connect https: ảnh avatar OAuth, R2 media, tile bản đồ theo cấu hình admin.
# - worker-src blob: MapLibre dựng worker từ blob. frame-src: xem trước PDF/tệp
#   (blob:), video YouTube/Vimeo, bản đồ nhúng do admin cấu hình.
# - Placeholder báo cáo ở cuối policy: frontend/docker/nginx/render-csp.sh thay
#   lúc build image bằng `; report-uri ...; report-to csp-endpoint` (endpoint
#   security của Sentry dựng từ VITE_SENTRY_DSN) và thêm header Reporting-Endpoints
#   ở cuối file; DSN trống thì xóa placeholder. Vì vậy không dùng thẳng file này.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'report-sample' 'sha256-pRNdau3dsxgAtTk/50MKNhYsYC1kMsWBvN2Z99JEUFc=' https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss://procv.site; media-src 'self' https:; frame-src 'self' blob: data: https:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests__CSP_REPORT__" always;
