# Authenticated Origin Pulls của Cloudflare (bật ở SSL/TLS -> Origin Server).
# Cloudflare trình chứng chỉ client ký bởi CA công khai này khi nối tới origin;
# request không có chứng chỉ hợp lệ (gọi thẳng IP VPS, quét cổng) nhận 403.
# `optional` + map $origin_pull_denied (procv.conf) thay cho `on` để deploy.sh
# vẫn gọi thử được từ chính máy chủ. CA đặt ở deploy/certs trên VPS, xem
# docs/06-deployment/huong-dan-deployment.md bước 1.4.
ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client optional;
if ($origin_pull_denied) {
    return 403;
}
