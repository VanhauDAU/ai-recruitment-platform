# Header cho phản hồi tĩnh của SPA. Phản hồi từ Django đã có header riêng do
# SecurityMiddleware đặt (HSTS theo SECURE_HSTS_SECONDS), nên không gắn ở đó để
# tránh trùng. add_header trong location ghi đè cấp server, vì vậy mỗi location
# tĩnh include snippet này.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
