# SPA: mọi route trả index.html; asset hash được cache dài hạn.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # The public reverse proxy intercepts every indexable route and sends
        # it through Django's SEO shell. Anything reaching this fallback is a
        # workspace, auth flow, or unknown route and must not be indexed.
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
