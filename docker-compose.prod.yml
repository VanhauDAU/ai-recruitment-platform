# Override PRODUCTION — dùng kèm file dev:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Yêu cầu: backend/.env đặt ENVIRONMENT=production, DJANGO_SETTINGS_MODULE
# =config.settings.production và đầy đủ biến BẮT BUỘC (xem backend/.env.example).
# Settings production sẽ fail-fast liệt kê mọi biến thiếu ngay khi container start.

services:
  db:
    restart: unless-stopped
    ports: !reset []   # không expose DB ra ngoài host ở production

  redis:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.production
      FRONTEND_SHELL_URL: http://frontend/
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-false}
    volumes: !override
      - backend_media:/app/legacy-media:ro
      - backend_public_media:/app/public-media
      - backend_private_media:/app/private-media
      - backend_quarantine:/app/quarantine
      - backend_static:/app/staticfiles
    ports: !reset []   # đi qua nginx, không expose trực tiếp

  worker:
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.production
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-false}
    volumes: !override
      - backend_media:/app/legacy-media:ro
      - backend_public_media:/app/public-media
      - backend_private_media:/app/private-media
      - backend_quarantine:/app/quarantine

  ai-worker:
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.production
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-false}
    volumes: !reset []

  beat:
    restart: unless-stopped
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.production
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-false}
    volumes: !reset []

  frontend:
    # Prod: build tĩnh + nginx thay cho vite dev server.
    image: !reset null
    build:
      context: ./frontend
      args:
        # Đặt trong file .env cạnh docker-compose.yml (compose interpolation).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_PUBLIC_ASSET_BASE_URL: ${VITE_PUBLIC_ASSET_BASE_URL:-}
        VITE_ANNOUNCEMENT_ROLLOUT_SURFACES: ${VITE_ANNOUNCEMENT_ROLLOUT_SURFACES:-}
    command: !reset null
    working_dir: !reset null
    restart: unless-stopped
    volumes: !reset []
    environment: {}
    ports: !reset []
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/procv.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/srv/backend-static:ro
      - backend_public_media:/srv/backend-public-media:ro
      # TLS cert mount tại đây khi có domain (letsencrypt/certbot)
    depends_on:
      - backend
      - frontend
    init: true
    pids_limit: ${NGINX_PIDS_LIMIT:-128}
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-3}

volumes:
  backend_static:
