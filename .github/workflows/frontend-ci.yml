name: Frontend CI

# Six job IDs below are required checks on main. Keep them stable while heavy
# work becomes path-aware and quality, coverage, and E2E run in parallel.
# Unit tests and E2E fan out into matrix jobs (`coverage-shard`,
# `e2e-smoke-shard`); `coverage` and `e2e-smoke` aggregate them so the required
# contexts and the final gate keep their exact names and skip semantics.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Dependency audit at 01:17 Asia/Ho_Chi_Minh every day.
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-frontend-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      docs: ${{ steps.areas.outputs.docs }}
      ci: ${{ steps.areas.outputs.ci }}
      deploy: ${{ steps.areas.outputs.deploy }}
      audit: ${{ steps.areas.outputs.frontend_audit }}
      changed_count: ${{ steps.areas.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed areas
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -o pipefail
          bash scripts/ci_changed_areas.sh | tee -a "$GITHUB_OUTPUT"

      - name: Publish change summary
        env:
          BACKEND: ${{ steps.areas.outputs.backend }}
          FRONTEND: ${{ steps.areas.outputs.frontend }}
          DOCS: ${{ steps.areas.outputs.docs }}
          CI_AREA: ${{ steps.areas.outputs.ci }}
          DEPLOY: ${{ steps.areas.outputs.deploy }}
          AUDIT: ${{ steps.areas.outputs.frontend_audit }}
          CHANGED_COUNT: ${{ steps.areas.outputs.changed_count }}
        run: |
          {
            echo '## Frontend CI change detection'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Event | ${{ github.event_name }} |"
            echo "| Changed files | ${CHANGED_COUNT:-0} |"
            echo "| Areas | backend=${BACKEND:-unknown}, frontend=${FRONTEND:-unknown}, docs=${DOCS:-unknown}, ci=${CI_AREA:-unknown}, deploy=${DEPLOY:-unknown} |"
            echo "| Dependency audit | ${AUDIT:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

  static-quality:
    name: static-quality
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$FRONTEND_CHANGED" == true || "$FRONTEND_CHANGED" == false ]]

      - name: Start job timer
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        id: timer
        working-directory: .
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: ${{ needs.changes.outputs.frontend == 'true' }}

      - name: Setup Node
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm ci --prefer-offline --no-audit

      - name: API boundary (axios chỉ trong shared/api)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: .
        run: bash scripts/check_api_boundary.sh

      - name: Feature boundary (không deep-import feature khác)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: .
        run: bash scripts/check_feature_boundary.sh

      - name: Env example đồng bộ với code
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: .
        run: bash scripts/check_env_sync.sh

      - name: Lint (oxlint)
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm run lint

      - name: Check layered architecture
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm run check:architecture

      - name: Build production bundle
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm run build

      - name: Check initial bundle gzip budget
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm run check:bundle-budget

      - name: Publish static-quality summary
        if: ${{ always() }}
        working-directory: .
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.timer.outputs.epoch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          frontend_changed = os.environ.get('FRONTEND_CHANGED') == 'true'
          js_size = css_size = 'n/a'
          stats_path = Path('frontend/dist/bundle-stats.json')
          if stats_path.exists():
              try:
                  stats = json.loads(stats_path.read_text())
                  initial = stats.get('initial', {})
                  js_size = f"{initial.get('javascriptGzipBytes', 0) / 1024:.1f} KiB"
                  css_size = f"{initial.get('stylesheetsGzipBytes', 0) / 1024:.1f} KiB"
              except (AttributeError, OSError, ValueError, TypeError):
                  pass

          started_at = os.environ.get('STARTED_AT')
          elapsed = f'{max(0, int(time.time()) - int(started_at))}s' if started_at else 'skipped'
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as stream:
              stream.write('## Frontend static quality\n\n')
              stream.write('| Metric | Value |\n| --- | --- |\n')
              stream.write(f"| Result | {os.environ.get('JOB_STATUS', 'unknown')} |\n")
              stream.write(f"| Heavy checks | {'run' if frontend_changed else 'skipped'} |\n")
              stream.write(f'| Initial JavaScript gzip | {js_size} |\n')
              stream.write(f'| Initial CSS gzip | {css_size} |\n')
              stream.write(f'| Measured checks elapsed | {elapsed} |\n')
          PY

      - name: Upload static diagnostics
        if: ${{ failure() && needs.changes.outputs.frontend == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist/bundle-stats.json
          if-no-files-found: ignore
          retention-days: 5

  coverage-shard:
    name: coverage-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every shard finish so one failure still yields complete diagnostics.
      fail-fast: false
      matrix:
        # Keep UNIT_TEST_SHARDS in the `coverage` job equal to this list's length.
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        id: coverage_tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          # Serialize jsdom/Ant Design interaction tests on GitHub-hosted
          # runners. Parallel workers compete for CPU and make otherwise fast
          # interaction tests exceed their per-test timeout under coverage.
          # Parallelism comes from separate runners instead of extra workers.
          #
          # A single shard only sees part of the suite, so the ratchet in
          # vite.config.js cannot be evaluated here. Thresholds are zeroed for
          # the shard and enforced once on the merged report by `coverage`.
          timeout --signal=TERM --kill-after=30s 17m \
            npm run test:coverage -- \
              --maxWorkers=1 \
              --shard="${SHARD}/${SHARD_TOTAL}" \
              --reporter=verbose \
              --reporter=blob \
              --coverage.thresholds.statements=0 \
              --coverage.thresholds.branches=0 \
              --coverage.thresholds.functions=0 \
              --coverage.thresholds.lines=0 \
              2>&1 | tee coverage.log

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload shard diagnostics
        if: ${{ always() && steps.coverage_tests.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/coverage.log
          if-no-files-found: ignore
          retention-days: 5

  coverage:
    name: coverage
    needs: [changes, coverage-shard]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Require every unit-test shard to pass
        working-directory: .
        env:
          SHARD_RESULT: ${{ needs.coverage-shard.result }}
        run: |
          echo "coverage-shard result: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == success ]]

      - uses: actions/checkout@v5

      - name: Start job timer
        id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports
          merge-multiple: true

      - name: Merge shards and enforce coverage gate
        id: coverage_tests
        shell: bash
        env:
          UNIT_TEST_SHARDS: 4
        run: |
          set -o pipefail
          ls -l .vitest-reports
          [[ "$(find .vitest-reports -name 'blob-*.json' | wc -l)" -eq "$UNIT_TEST_SHARDS" ]]
          # No test runs here: Vitest replays the blob reports, merges
          # their coverage maps and applies the thresholds from vite.config.js.
          npx vitest run --merge-reports \
            --coverage \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=vitest-results.xml \
            2>&1 | tee coverage.log

      - name: Verify coverage ratchet on merged report
        run: |
          # Independent check against the same thresholds object, so the gate
          # cannot silently disappear if merge-reports behaviour ever changes.
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs'
          import config from './vite.config.js'

          const { thresholds } = config({ mode: 'test', command: 'serve' }).test.coverage
          const total = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total
          let failed = false
          for (const [metric, minimum] of Object.entries(thresholds)) {
            const actual = total[metric]?.pct
            const ok = typeof actual === 'number' && actual >= minimum
            console.log(`${ok ? 'ok  ' : 'FAIL'} ${metric}: ${actual}% (threshold ${minimum}%)`)
            if (!ok) failed = true
          }
          process.exit(failed ? 1 : 0)
          JS

      - name: Publish coverage summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.timer.outputs.epoch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tests = failures = errors = skipped = 'n/a'
          junit_path = Path('vitest-results.xml')
          if junit_path.exists():
              try:
                  root = ET.parse(junit_path).getroot()
                  cases = root.findall('.//testcase')
                  tests = str(len(cases))
                  failures = str(sum(case.find('failure') is not None for case in cases))
                  errors = str(sum(case.find('error') is not None for case in cases))
                  skipped = str(sum(case.find('skipped') is not None for case in cases))
              except (OSError, ET.ParseError):
                  pass

          values = {key: 'n/a' for key in ('lines', 'statements', 'functions', 'branches')}
          coverage_path = Path('coverage/coverage-summary.json')
          if coverage_path.exists():
              try:
                  total = json.loads(coverage_path.read_text()).get('total', {})
                  for key in values:
                      if key in total:
                          values[key] = f"{total[key].get('pct', 'n/a')}%"
              except (AttributeError, OSError, ValueError, TypeError):
                  pass

          started_at = int(os.environ.get('STARTED_AT') or time.time())
          elapsed = max(0, int(time.time()) - started_at)
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as stream:
              stream.write('## Frontend coverage (shards merged)\n\n')
              stream.write('| Metric | Value |\n| --- | --- |\n')
              stream.write(f"| Result | {os.environ.get('JOB_STATUS', 'unknown')} |\n")
              stream.write(f'| Tests | {tests} |\n')
              stream.write(f'| Failures / errors / skipped | {failures} / {errors} / {skipped} |\n')
              stream.write(f"| Statements / branches | {values['statements']} / {values['branches']} |\n")
              stream.write(f"| Functions / lines | {values['functions']} / {values['lines']} |\n")
              stream.write(f'| Merge job elapsed | {elapsed}s |\n')
          PY

      - name: Upload coverage diagnostics
        if: ${{ always() && steps.coverage_tests.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/coverage
            frontend/coverage.log
            frontend/vitest-results.xml
          if-no-files-found: ignore
          retention-days: 5

  e2e-smoke-shard:
    name: e2e-smoke-shard (${{ matrix.project }})
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Must list every project in frontend/playwright.config.js; the
        # e2e-smoke job below fails if the two lists drift apart.
        project: [desktop-chromium, tablet-chromium, mobile-chromium]
    env:
      # E2E mocks intercept this stable backend origin. Without an explicit
      # value, CI has no gitignored frontend/.env and Vite falls back to its
      # same-origin proxy, bypassing older route fixtures bound to port 8000.
      VITE_API_BASE_URL: http://localhost:8000/api
      # Smoke-test the production bundle (vite build + vite preview). The
      # unbundled dev server made multi-route tests exceed their 30s budget on
      # hosted runners. Set to `dev` to restore the previous behaviour.
      PLAYWRIGHT_WEB_SERVER: preview
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Start job timer
        id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run portal smoke tests (${{ matrix.project }})
        id: e2e
        shell: bash
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/e2e-results.xml
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          # Keep traces from the first failing run. Re-running every failure
          # used another ~5.5 minutes without producing a stable signal.
          timeout --signal=TERM --kill-after=30s 17m \
            npm run test:e2e:smoke -- \
              --project="$PROJECT" \
              --reporter=line,junit \
              --trace=retain-on-failure \
            2>&1 | tee e2e.log

      - name: Publish E2E summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.timer.outputs.epoch }}
          PROJECT: ${{ matrix.project }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          metrics = {key: 'n/a' for key in ('tests', 'failures', 'errors', 'skipped', 'time')}
          report_path = Path('test-results/e2e-results.xml')
          if report_path.exists():
              try:
                  root = ET.parse(report_path).getroot()
                  for key in metrics:
                      metrics[key] = root.attrib.get(key, 'n/a')
              except (OSError, ET.ParseError):
                  pass

          started_at = int(os.environ.get('STARTED_AT') or time.time())
          elapsed = max(0, int(time.time()) - started_at)
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as stream:
              stream.write(f"## Frontend E2E smoke — {os.environ.get('PROJECT', 'unknown')}\n\n")
              stream.write('| Metric | Value |\n| --- | --- |\n')
              stream.write(f"| Result | {os.environ.get('JOB_STATUS', 'unknown')} |\n")
              stream.write(f"| Tests | {metrics['tests']} |\n")
              stream.write(f"| Failures / errors / skipped | {metrics['failures']} / {metrics['errors']} / {metrics['skipped']} |\n")
              stream.write(f"| Playwright duration | {metrics['time']}s |\n")
              stream.write(f'| Measured checks elapsed | {elapsed}s |\n')
          PY

      - name: Upload Playwright diagnostics
        if: ${{ always() && steps.e2e.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e.log
          if-no-files-found: ignore
          retention-days: 5

  e2e-smoke:
    name: e2e-smoke
    needs: [changes, e2e-smoke-shard]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Matrix covers every Playwright project
        run: |
          # A project added to playwright.config.js but not to the matrix
          # would silently stop running; fail instead.
          configured="$(grep -oE "name: '[a-z0-9-]+'" frontend/playwright.config.js | sed -E "s/name: '(.*)'/\1/" | sort | tr '\n' ' ')"
          matrix="$(printf '%s\n' desktop-chromium tablet-chromium mobile-chromium | sort | tr '\n' ' ')"
          echo "playwright.config.js: $configured"
          echo "workflow matrix:      $matrix"
          [[ -n "$configured" && "$configured" == "$matrix" ]]

      - name: Require every viewport shard to pass
        env:
          SHARD_RESULT: ${{ needs.e2e-smoke-shard.result }}
        run: |
          echo "Smoke suite runs per viewport in e2e-smoke-shard; this job preserves the required context." >> "$GITHUB_STEP_SUMMARY"
          echo "e2e-smoke-shard result: $SHARD_RESULT"
          [[ "$SHARD_RESULT" == success ]]

  audit:
    name: audit
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AUDIT_REQUIRED: ${{ needs.changes.outputs.audit }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$AUDIT_REQUIRED" == true || "$AUDIT_REQUIRED" == false ]]

      - uses: actions/checkout@v5
        if: ${{ needs.changes.outputs.audit == 'true' }}

      - name: Start job timer
        if: ${{ needs.changes.outputs.audit == 'true' }}
        id: timer
        working-directory: .
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ needs.changes.outputs.audit == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fail on high-severity dependency vulnerabilities
        if: ${{ needs.changes.outputs.audit == 'true' }}
        run: npm audit --package-lock-only --audit-level=high

      - name: Publish dependency audit summary
        if: ${{ always() }}
        working-directory: .
        env:
          AUDIT_REQUIRED: ${{ needs.changes.outputs.audit }}
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.timer.outputs.epoch }}
        run: |
          if [[ "$AUDIT_REQUIRED" == true ]]; then
            if [[ -n "$STARTED_AT" ]]; then
              elapsed="$(( $(date +%s) - STARTED_AT ))s"
            else
              elapsed='n/a'
            fi
            reason='Dependency files changed, main was updated, or this is a scheduled/manual run.'
          else
            elapsed='skipped'
            reason='No dependency audit trigger in this pull request.'
          fi
          {
            echo '## Frontend dependency audit'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Result | $JOB_STATUS |"
            echo "| Audit command | $([[ "$AUDIT_REQUIRED" == true ]] && echo run || echo skipped) |"
            echo "| Duration | $elapsed |"
            echo "| Reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: [changes, static-quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve build required check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static-quality.result }}
        run: |
          echo 'Build now runs inside static-quality; this job preserves the required context.' >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHANGES_RESULT" == success && "$STATIC_RESULT" == success ]]

  bundle-budget:
    name: bundle-budget
    needs: [changes, static-quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve bundle-budget required check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static-quality.result }}
        run: |
          echo 'Bundle budget now runs inside static-quality; this job preserves the required context.' >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHANGES_RESULT" == success && "$STATIC_RESULT" == success ]]

  final:
    name: frontend-final-gate
    needs: [changes, static-quality, coverage, build, bundle-budget, e2e-smoke, audit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate frontend quality gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          AUDIT_REQUIRED: ${{ needs.changes.outputs.audit }}
          STATIC_RESULT: ${{ needs.static-quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUDGET_RESULT: ${{ needs.bundle-budget.result }}
          E2E_RESULT: ${{ needs.e2e-smoke.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          gate=success

          [[ "$CHANGES_RESULT" == success ]] || gate=failure
          [[ "$STATIC_RESULT" == success ]] || gate=failure
          [[ "$BUILD_RESULT" == success ]] || gate=failure
          [[ "$BUDGET_RESULT" == success ]] || gate=failure
          [[ "$AUDIT_RESULT" == success ]] || gate=failure

          if [[ "$FRONTEND_CHANGED" == true ]]; then
            [[ "$COVERAGE_RESULT" == success ]] || gate=failure
            [[ "$E2E_RESULT" == success ]] || gate=failure
          elif [[ "$FRONTEND_CHANGED" == false ]]; then
            [[ "$COVERAGE_RESULT" == skipped ]] || gate=failure
            [[ "$E2E_RESULT" == skipped ]] || gate=failure
          else
            gate=failure
          fi

          {
            echo '## Frontend final gate'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Changed frontend | ${FRONTEND_CHANGED:-unknown} |"
            echo "| static-quality | ${STATIC_RESULT:-unknown} |"
            echo "| coverage | ${COVERAGE_RESULT:-unknown} |"
            echo "| build | ${BUILD_RESULT:-unknown} |"
            echo "| bundle-budget | ${BUDGET_RESULT:-unknown} |"
            echo "| e2e-smoke | ${E2E_RESULT:-unknown} |"
            echo "| audit (required=${AUDIT_REQUIRED:-unknown}) | ${AUDIT_RESULT:-unknown} |"
            echo "| Overall gate | ${gate^^} |"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$gate" == success ]]
