name: Backend CI

# Keep the stable `quality` context visible on every pull request. The
# change detector skips PostgreSQL and the heavy checks when backend inputs
# are untouched, while the final gate still fails closed if detection breaks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-backend-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      docs: ${{ steps.areas.outputs.docs }}
      ci: ${{ steps.areas.outputs.ci }}
      deploy: ${{ steps.areas.outputs.deploy }}
      backend_migrations: ${{ steps.areas.outputs.backend_migrations }}
      changed_count: ${{ steps.areas.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed areas
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -o pipefail
          bash scripts/ci_changed_areas.sh | tee -a "$GITHUB_OUTPUT"

      - name: Publish change summary
        env:
          BACKEND: ${{ steps.areas.outputs.backend }}
          FRONTEND: ${{ steps.areas.outputs.frontend }}
          DOCS: ${{ steps.areas.outputs.docs }}
          CI_AREA: ${{ steps.areas.outputs.ci }}
          DEPLOY: ${{ steps.areas.outputs.deploy }}
          MIGRATIONS: ${{ steps.areas.outputs.backend_migrations }}
          CHANGED_COUNT: ${{ steps.areas.outputs.changed_count }}
        run: |
          {
            echo '## Backend CI change detection'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Event | ${{ github.event_name }} |"
            echo "| Changed files | ${CHANGED_COUNT:-0} |"
            echo "| Backend | ${BACKEND:-unknown} |"
            echo "| Frontend | ${FRONTEND:-unknown} |"
            echo "| Docs | ${DOCS:-unknown} |"
            echo "| CI | ${CI_AREA:-unknown} |"
            echo "| Deploy | ${DEPLOY:-unknown} |"
            echo "| Migration suite | ${MIGRATIONS:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-checks:
    name: backend-checks
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_career_coach
        ports: ['5432:5432']
        # CI data is thrown away with the job: keep the cluster in RAM.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: ai_career_coach
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY: ci-secret-key-at-least-32-characters-long-xxx
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: config.settings.test
      # pytest-xdist worker count. Each worker owns a separate test database
      # (test_<name>_gwN). Set to '0' to fall back to the serial run.
      PYTEST_WORKERS: auto
    steps:
      - name: Start job timer
        id: timer
        working-directory: .
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff==0.15.22

      - name: Tune PostgreSQL for throwaway CI data
        working-directory: .
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Durability is irrelevant for a database that dies with the job.
          # All three settings are reloadable, so no restart is needed.
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Kiến trúc layer (import-linter)
        run: lint-imports

      - name: Layering DRF (services/selectors sạch HTTP machinery)
        working-directory: .
        run: bash scripts/check_backend_layering.sh

      - name: Env example đồng bộ với code
        working-directory: .
        run: bash scripts/check_env_sync.sh

      - name: Django system check
        run: python manage.py check

      - name: Migration state (không được có migration treo)
        run: python manage.py makemigrations --check --dry-run

      - name: Admin permission registry sync
        working-directory: .
        run: bash scripts/check_admin_permissions_sync.sh

      - name: Test suite + coverage gate (ratchet — chỉ được tăng)
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          # Stop pytest before the job-level timeout so always() diagnostics
          # still have time to publish the active test and faulthandler output.
          # --dist load hands tests to workers in collection order.
          # pytest-django sorts every TestCase before every
          # TransactionTestCase, so each worker reaches the transactional
          # tests (which TRUNCATE migration-seeded rows) only after its
          # ordinary tests. --dist loadfile broke that invariant: a module
          # containing a TransactionTestCase wiped the seed data for the
          # modules that followed it on the same worker (89 failures, 29
          # errors on run 2). Do not switch to loadfile or worksteal.
          #
          # Migration upgrade/recovery tests are excluded here: they were 19 of
          # the suite's 31 serial minutes and run in `backend-migration-tests`
          # when the change detector says they can be affected.
          timeout --signal=TERM --kill-after=30s 47m pytest -vv \
            -n "$PYTEST_WORKERS" --dist load \
            --ignore-glob='*/tests/test_*migrations*.py' \
            --cov \
            --cov-fail-under=84 \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --junitxml=pytest-results.xml \
            2>&1 | tee pytest.log

      - name: Publish backend metrics
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.timer.outputs.epoch }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tests = failures = errors = skipped = 'n/a'
          test_duration = 'n/a'
          junit_path = Path('pytest-results.xml')
          if junit_path.exists():
              try:
                  root = ET.parse(junit_path).getroot()
                  cases = root.findall('.//testcase')
                  tests = str(len(cases))
                  failures = str(sum(case.find('failure') is not None for case in cases))
                  errors = str(sum(case.find('error') is not None for case in cases))
                  skipped = str(sum(case.find('skipped') is not None for case in cases))
                  test_duration = f"{sum(float(case.attrib.get('time', 0)) for case in cases):.2f}"
              except (OSError, ET.ParseError, TypeError, ValueError):
                  pass

          coverage = 'n/a'
          coverage_path = Path('coverage.json')
          if coverage_path.exists():
              try:
                  payload = json.loads(coverage_path.read_text())
                  value = payload.get('totals', {}).get('percent_covered')
                  if value is not None:
                      coverage = f'{float(value):.2f}%'
              except (AttributeError, OSError, ValueError, TypeError):
                  pass

          started_at = int(os.environ.get('STARTED_AT') or time.time())
          elapsed = max(0, int(time.time()) - started_at)
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as stream:
              stream.write('## Backend checks\n\n')
              stream.write('| Metric | Value |\n| --- | --- |\n')
              stream.write(f"| Result | {os.environ.get('JOB_STATUS', 'unknown')} |\n")
              stream.write(f'| Tests | {tests} |\n')
              stream.write(f'| Failures / errors / skipped | {failures} / {errors} / {skipped} |\n')
              stream.write(f'| Coverage | {coverage} |\n')
              stream.write(f'| Pytest duration | {test_duration}s |\n')
              stream.write(f'| Measured steps elapsed | {elapsed}s |\n')
          PY

      - name: Upload backend diagnostics
        if: ${{ always() && steps.pytest.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/pytest.log
            backend/pytest-results.xml
            backend/coverage.json
          if-no-files-found: ignore
          retention-days: 5

  backend-migration-tests:
    name: backend-migration-tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_career_coach
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: ai_career_coach
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY: ci-secret-key-at-least-32-characters-long-xxx
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTEST_WORKERS: auto
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tune PostgreSQL for throwaway CI data
        working-directory: .
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Migration upgrade and recovery tests
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          shopt -s nullglob
          files=(apps/*/tests/test_*migrations*.py)
          echo "Migration test modules: ${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # An empty match would make pytest collect the whole suite.
          [[ "${#files[@]}" -gt 0 ]]
          # Every test rewinds and replays the schema inside its own worker
          # database, so tests are independent and can be spread one by one
          # (--dist load) instead of being pinned to their module's worker.
          # Coverage is gated in backend-checks; migrations are omitted from
          # the coverage source anyway.
          timeout --signal=TERM --kill-after=30s 27m pytest -vv \
            -n "$PYTEST_WORKERS" --dist load \
            --junitxml=pytest-migrations.xml \
            "${files[@]}" \
            2>&1 | tee pytest-migrations.log

      - name: Upload migration diagnostics
        if: ${{ always() && steps.pytest.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/pytest-migrations.log
            backend/pytest-migrations.xml
          if-no-files-found: ignore
          retention-days: 5

  quality:
    name: quality
    needs: [changes, backend-checks, backend-migration-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate backend quality gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          MIGRATIONS_REQUIRED: ${{ needs.changes.outputs.backend_migrations }}
          MIGRATIONS_RESULT: ${{ needs.backend-migration-tests.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          CHANGED_COUNT: ${{ needs.changes.outputs.changed_count }}
        run: |
          gate=failure
          reason='Change detection or backend checks did not complete successfully.'

          # The migration suite must have passed when it was required and must
          # have been skipped (never failed or cancelled) when it was not.
          migrations_ok=false
          if [[ "$BACKEND_CHANGED" == true && "$MIGRATIONS_REQUIRED" == true ]]; then
            [[ "$MIGRATIONS_RESULT" == success ]] && migrations_ok=true
          elif [[ "$MIGRATIONS_REQUIRED" == true || "$MIGRATIONS_REQUIRED" == false ]]; then
            [[ "$MIGRATIONS_RESULT" == skipped ]] && migrations_ok=true
          fi

          if [[ "$migrations_ok" != true ]]; then
            reason="Migration suite result '${MIGRATIONS_RESULT:-unknown}' does not match detector output '${MIGRATIONS_REQUIRED:-unknown}'."
          elif [[ "$CHANGES_RESULT" == success && "$BACKEND_CHANGED" == true && "$BACKEND_RESULT" == success ]]; then
            gate=success
            reason='All backend checks passed.'
          elif [[ "$CHANGES_RESULT" == success && "$BACKEND_CHANGED" == false && "$BACKEND_RESULT" == skipped ]]; then
            gate=success
            reason='No backend-impacting changes; heavy checks were skipped.'
          fi

          {
            echo '## Backend quality gate'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Changed files | ${CHANGED_COUNT:-unknown} |"
            echo "| Areas | backend=${BACKEND_CHANGED:-unknown}, frontend=${FRONTEND_CHANGED:-unknown}, docs=${DOCS_CHANGED:-unknown}, ci=${CI_CHANGED:-unknown}, deploy=${DEPLOY_CHANGED:-unknown} |"
            echo "| Heavy checks | ${BACKEND_RESULT:-unknown} |"
            echo "| Migration suite (required=${MIGRATIONS_REQUIRED:-unknown}) | ${MIGRATIONS_RESULT:-unknown} |"
            echo "| Gate | ${gate^^} |"
            echo "| Reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$gate" == success ]]
