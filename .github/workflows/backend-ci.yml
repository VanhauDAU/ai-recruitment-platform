name: Backend CI

# Keep the stable `quality` context visible on every pull request. The
# change detector skips PostgreSQL and the heavy checks when backend inputs
# are untouched, while the final gate still fails closed if detection breaks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-backend-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      docs: ${{ steps.areas.outputs.docs }}
      ci: ${{ steps.areas.outputs.ci }}
      deploy: ${{ steps.areas.outputs.deploy }}
      changed_count: ${{ steps.areas.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed areas
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -o pipefail
          bash scripts/ci/changed_areas.sh | tee -a "$GITHUB_OUTPUT"

      - name: Publish change summary
        env:
          BACKEND: ${{ steps.areas.outputs.backend }}
          FRONTEND: ${{ steps.areas.outputs.frontend }}
          DOCS: ${{ steps.areas.outputs.docs }}
          CI_AREA: ${{ steps.areas.outputs.ci }}
          DEPLOY: ${{ steps.areas.outputs.deploy }}
          CHANGED_COUNT: ${{ steps.areas.outputs.changed_count }}
        run: |
          {
            echo '## Backend CI change detection'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Event | ${{ github.event_name }} |"
            echo "| Changed files | ${CHANGED_COUNT:-0} |"
            echo "| Backend | ${BACKEND:-unknown} |"
            echo "| Frontend | ${FRONTEND:-unknown} |"
            echo "| Docs | ${DOCS:-unknown} |"
            echo "| CI | ${CI_AREA:-unknown} |"
            echo "| Deploy | ${DEPLOY:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Static gates need no database and finish in well under a minute, so they
  # run beside the test shards instead of in front of them.
  backend-static:
    name: backend-static
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-at-least-32-characters-long-xxx
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        uses: ./.github/actions/install-backend

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Kiến trúc layer (import-linter)
        run: lint-imports

      - name: Layering DRF (services/selectors/tasks/signals sạch HTTP machinery)
        working-directory: .
        run: bash scripts/check_backend_layering.sh

      - name: Cấu trúc app + import chéo app (ADR-0022)
        working-directory: .
        run: python scripts/check_backend_imports.py

      - name: Env example đồng bộ với code
        working-directory: .
        run: bash scripts/check_env_sync.sh

      - name: Django system check
        run: python manage.py check

      - name: Migration state (không được có migration treo)
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema (khớp docs/04-api/openapi.yaml, cảnh báo không tăng)
        working-directory: .
        run: bash scripts/check_openapi_schema.sh

  backend-tests:
    name: backend-tests (${{ matrix.group }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pytest-split balances groups by backend/.test_durations. Keep
        # BACKEND_TEST_GROUPS in `backend-checks` equal to this list's length.
        group: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_career_coach
        ports: ['5432:5432']
        # CI data is thrown away with the job: keep the cluster in RAM.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: ai_career_coach
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY: ci-secret-key-at-least-32-characters-long-xxx
      DEBUG: 'True'
      DJANGO_SETTINGS_MODULE: config.settings.test
      # pytest-xdist worker count. Each worker owns a separate test database
      # (test_<name>_gwN). Set to '0' to fall back to the serial run.
      PYTEST_WORKERS: auto
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        uses: ./.github/actions/install-backend

      - name: Tune PostgreSQL for throwaway CI data
        working-directory: .
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Durability is irrelevant for a database that dies with the job.
          # All three settings are reloadable, so no restart is needed.
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Test shard ${{ matrix.group }}/${{ strategy.job-total }}
        id: pytest
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          # duration_based_chunks keeps collection order inside each group.
          # pytest-django sorts every TestCase before every TransactionTestCase
          # (which TRUNCATE migration-seeded rows), and --dist load hands tests
          # to workers in that order. Algorithms that reorder tests (least_duration)
          # or --dist loadfile/worksteal break that invariant: a module with a
          # TransactionTestCase wiped the seed data of the modules after it
          # (89 failures, 29 errors). Do not change either option.
          #
          # faulthandler_timeout (120s in pyproject.toml) also counts fixture
          # setup, so workers dumped stacks while the test database was still
          # being built and then died. The job-level `timeout` catches real hangs.
          # Coverage is combined and gated once in `backend-checks`.
          timeout --signal=TERM --kill-after=30s 8m pytest -vv \
            --splits "$SHARD_TOTAL" --group "$GROUP" \
            --splitting-algorithm duration_based_chunks \
            -n "$PYTEST_WORKERS" --dist load \
            -o faulthandler_timeout=600 \
            --cov --cov-report= \
            --junitxml="pytest-results-$GROUP.xml" \
            -o junit_duration_report=call \
            2>&1 | tee pytest.log
          mv .coverage ".coverage.group$GROUP"

      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-${{ matrix.group }}
          path: |
            backend/.coverage.group*
            backend/pytest-results-*.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload shard diagnostics
        if: ${{ always() && steps.pytest.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-diagnostics-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/pytest.log
          if-no-files-found: ignore
          retention-days: 5

  # Keeps the `backend-checks` context: combines the shards, applies the
  # coverage ratchet and the time budget once over the whole suite.
  backend-checks:
    name: backend-checks
    needs: [changes, backend-static, backend-tests]
    if: ${{ needs.changes.outputs.backend == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Require static gates and every test shard to pass
        working-directory: .
        env:
          STATIC_RESULT: ${{ needs.backend-static.result }}
          TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          echo "backend-static: $STATIC_RESULT, backend-tests: $TESTS_RESULT"
          [[ "$STATIC_RESULT" == success && "$TESTS_RESULT" == success ]]

      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check "$(grep -E '^coverage==' requirements-dev.txt)"

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: backend-tests-*
          path: backend
          merge-multiple: true

      - name: Combine coverage and enforce the ratchet
        env:
          BACKEND_TEST_GROUPS: 3
        run: |
          [[ "$(ls .coverage.group* | wc -l)" -eq "$BACKEND_TEST_GROUPS" ]]
          python -m coverage combine .coverage.group*
          python -m coverage report --skip-covered --skip-empty --fail-under=84 | tail -n 25
          python -m coverage json -o coverage.json --quiet

      - name: Test time budget (docs/05-huong-dan/tieu-chuan-kiem-thu.md)
        working-directory: .
        run: node scripts/ci/check_test_budgets.mjs --suite backend backend/pytest-results-*.xml

      - name: Export test durations for pytest-split
        if: ${{ always() }}
        working-directory: .
        run: python scripts/ci/pytest_durations.py backend-test-durations.json backend/pytest-results-*.xml

      - name: Upload test durations
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-durations-${{ github.run_id }}
          path: backend-test-durations.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish backend metrics
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          cases = []
          for report in sorted(Path('.').glob('pytest-results-*.xml')):
              try:
                  cases.extend(ET.parse(report).getroot().iter('testcase'))
              except ET.ParseError:
                  pass
          failures = sum(case.find('failure') is not None for case in cases)
          errors = sum(case.find('error') is not None for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          duration = sum(float(case.get('time') or 0) for case in cases)

          coverage = 'n/a'
          if Path('coverage.json').exists():
              value = json.loads(Path('coverage.json').read_text()).get('totals', {}).get('percent_covered')
              if value is not None:
                  coverage = f'{float(value):.2f}%'

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('## Backend checks (shards merged)\n\n| Metric | Value |\n| --- | --- |\n')
              stream.write(f'| Tests | {len(cases)} |\n')
              stream.write(f'| Failures / errors / skipped | {failures} / {errors} / {skipped} |\n')
              stream.write(f'| Coverage | {coverage} |\n')
              stream.write(f'| Sum of test call time | {duration:.0f}s |\n')
          PY

  quality:
    name: quality
    needs: [changes, backend-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate backend quality gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
          CI_CHANGED: ${{ needs.changes.outputs.ci }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          CHANGED_COUNT: ${{ needs.changes.outputs.changed_count }}
        run: |
          gate=failure
          reason='Change detection or backend checks did not complete successfully.'

          if [[ "$CHANGES_RESULT" == success && "$BACKEND_CHANGED" == true && "$BACKEND_RESULT" == success ]]; then
            gate=success
            reason='All backend checks passed.'
          elif [[ "$CHANGES_RESULT" == success && "$BACKEND_CHANGED" == false && "$BACKEND_RESULT" == skipped ]]; then
            gate=success
            reason='No backend-impacting changes; heavy checks were skipped.'
          fi

          {
            echo '## Backend quality gate'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Changed files | ${CHANGED_COUNT:-unknown} |"
            echo "| Areas | backend=${BACKEND_CHANGED:-unknown}, frontend=${FRONTEND_CHANGED:-unknown}, docs=${DOCS_CHANGED:-unknown}, ci=${CI_CHANGED:-unknown}, deploy=${DEPLOY_CHANGED:-unknown} |"
            echo "| Heavy checks | ${BACKEND_RESULT:-unknown} |"
            echo "| Gate | ${gate^^} |"
            echo "| Reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$gate" == success ]]
