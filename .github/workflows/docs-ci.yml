name: Docs CI

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check internal Markdown links
        run: python3 scripts/check_markdown_links.py
