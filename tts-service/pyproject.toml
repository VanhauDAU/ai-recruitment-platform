[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procv-vieneu-tts"
version = "0.1.0"
description = "Private VieNeu-TTS streaming service for ProCV"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "uvicorn[standard]==0.35.0",
  "vieneu==3.2.3",
]

[project.optional-dependencies]
gpu = [
  "vieneu[gpu]==3.2.3",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
