# Reverse proxy production: / -> frontend (nginx tĩnh), /api + /admin -> backend.
# TLS: thêm server block 443 + certbot khi có domain thật.

upstream backend_app {
    server backend:8000;
}
upstream frontend_app {
    server frontend:80;
}
upstream tts_app {
    server tts:8001;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bản đọc đã tạo sẵn là asset content-addressed. Giữ Range/If-Range để
    # native <audio> có thể phát, seek và resume ngay mà không tải lại cả file.
    location /tts/v1/assets/ {
        access_log off;
        proxy_pass http://tts_app;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_force_ranges on;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream PCM cache-miss trực tiếp từ service, không giữ Gunicorn worker
    # và không buffer toàn bộ WAV trước byte audio đầu tiên.
    location /tts/ {
        access_log off;
        proxy_pass http://tts_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering no always;
    }

    # Static của Django admin (collectstatic)
    location /static/ {
        alias /srv/backend-static/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Chỉ presentation media đã phân loại public được serve trực tiếp.
    # Legacy/private/quarantine không được mount vào container nginx.
    location /media/ {
        alias /srv/backend-public-media/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Public, search-visible routes receive a Django-rendered head while the
    # body and hashed assets remain the same Vite SPA document.
    location ~ ^/(?:$|robots\.txt$|sitemap\.xml$|sitemaps/(?:static|jobs|blog|cv-templates)\.xml$|chinh-sach-cookie$|viec-lam(?:$|/tai/[^/]+$|/[^/]+$)|jobs(?:$|/[^/]+$)|brand/[^/]+/tuyen-dung/[^/]+$|blog(?:$|/danh-muc/[^/]+$|/[^/]+$)|mau-cv(?:-[^/]+)?(?:/.*)?$|cv-templates(?:/.*)?$|tuyendung(?:$|/(?:gioi-thieu|dich-vu|bao-gia|lien-he|dieu-khoan-dich-vu|chinh-sach-quyen-rieng)$)) {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}
