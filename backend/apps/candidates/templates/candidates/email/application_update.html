{% extends "candidates/email/_layout.html" %}
{% block body %}
  <p style="margin-top:0">Xin chào <strong>{{ candidate_name }}</strong>,</p>
  <h1 style="margin:0 0 12px;font-size:20px;line-height:1.35;color:#0f172a">{{ title }}</h1>
  <p style="margin:0;line-height:1.6">{{ message }}</p>
  <p style="margin:22px 0 0"><a href="{{ action_url }}" style="display:inline-block;padding:11px 18px;border-radius:8px;background:{{ brand.primary_color }};color:#fff;text-decoration:none;font-weight:700">{{ action_label }}</a></p>
{% endblock %}
