[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*/migrations/*", "venv", "media"]

[tool.ruff.lint]
# Lỗi thật (E,F), import (I), modern hóa (UP), bug tiềm ẩn (B), rule Django (DJ).
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
  # Django settings dùng star import theo convention (base -> development/production/test)
  "F403", "F405",
  # Cho phép line dài trong comment/URL — format lo phần code
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.ruff.format]
quote-style = "single"

# ─── import-linter: đóng đinh quy tắc layer của ADR-0022 ───
# DRF-trong-services được gác bằng scripts/check_backend_layering.sh (grep) vì
# import-linter không forbid được subpackage của external package.
[tool.importlinter]
root_packages = ["apps", "common", "config"]

[[tool.importlinter.contracts]]
name = "common không import từ apps"
type = "forbidden"
source_modules = ["common"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "layer trong mỗi app: api -> services/selectors -> models -> domain"
type = "layers"
containers = [
    "apps.accounts", "apps.ai_core", "apps.applications", "apps.blog", "apps.campaigns",
    "apps.candidates",
    "apps.cv_templates", "apps.cvs", "apps.dashboard", "apps.employers",
    "apps.jobs", "apps.locations", "apps.matching", "apps.privacy",
    "apps.sitecontent", "apps.skills", "apps.knowledgebase", "apps.uploads",
]
layers = [
    "(api)",
    "(services) | (selectors)",
    "(models)",
    "(domain)",
]
exhaustive = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# --reuse-db bị cấm: TransactionTestCase truncate cả data seed từ migration,
# lần chạy sau sẽ fail giả. Luôn tạo DB test mới.
addopts = "--create-db --durations=30"
faulthandler_timeout = 120
junit_family = "xunit2"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "common"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]
