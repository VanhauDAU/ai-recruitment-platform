# Môi trường DEV: docker compose up
# Backend đọc backend/.env; các biến hostname bị override trỏ vào service nội bộ.

# CELERY_BROKER_URL phải override TƯỜNG MINH: settings chỉ fallback về REDIS_URL
# khi biến này vắng mặt, mà .env lại set sẵn 127.0.0.1 -> worker không thấy broker.
x-service-hosts: &service-hosts
  # Image mặc định production (backend/Dockerfile); compose là môi trường dev.
  DJANGO_SETTINGS_MODULE: config.settings.development
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/1
  PUBLIC_MEDIA_ROOT: /app/public-media
  PRIVATE_MEDIA_ROOT: /app/private-media
  UPLOAD_QUARANTINE_ROOT: /app/quarantine
  # Trang in PDF CV (Vite dev server trong compose); worker mở bằng Chromium.
  CV_PRINT_URL: http://frontend:5173/cv-print.html
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

# json-file mặc định tăng vô hạn và thường là phần dung lượng local khó phát hiện.
# Mọi service dùng cùng chính sách xoay log.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Django, Celery worker/beat và job init chạy cùng code/dependency. Dùng chung
# một image/tag để Compose không tạo bốn image backend giống hệt nhau.
x-backend-image: &backend-image
  image: ai-recruitment-platform-backend
  build:
    context: ./backend
    target: runtime
    args:
      INSTALL_DEV: 'true'

services:
  # Named volumes are initially owned by root, while Django deliberately runs
  # as appuser, so the isolated media roots are chowned once before startup.
  media-init:
    <<: *backend-image
    user: '0:0'
    command: sh -c 'chown -R appuser:appuser /app/public-media /app/private-media /app/quarantine'
    volumes:
      - backend_public_media:/app/public-media
      - backend_private_media:/app/private-media
      - backend_quarantine:/app/quarantine
    logging: *default-logging

  db:
    # PostgreSQL 16 kèm extension `vector` (app matching lưu embedding CV/JD).
    # Giữ hậu tố -trixie: volume pgdata được tạo trên Debian trixie (glibc 2.41);
    # tag `pg16` trần là bookworm (glibc 2.36) sẽ gây lệch phiên bản collation.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_career_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host dùng 5433 để không trùng Postgres cài trực tiếp trên máy (cả hai đều
    # tên DB ai_career_coach/postgres:postgres nên rất dễ nối lẫn DB trong DBeaver).
    # Cổng nội bộ vẫn là 5432 -> backend/worker trong compose không đổi gì.
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # Scanner thật chỉ bật theo profile để không giữ 3-4 GB RAM trong mọi phiên
  # development. Không publish TCP 3310 ra host; backend/worker kết nối qua
  # private Compose network. Feature tag được pin để không tự nhảy major/minor.
  clamav:
    image: clamav/clamav:1.4_base
    # Official 1.4 image is amd64-only; Docker Desktop on Apple Silicon runs it
    # through emulation.
    platform: linux/amd64
    profiles: [scanner]
    environment:
      CLAMAV_NO_MILTERD: 'true'
      CLAMD_STARTUP_TIMEOUT: 900
      FRESHCLAM_CHECKS: 12
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: 4g
    cpus: 2
    init: true
    restart: unless-stopped
    logging: *default-logging

  backend:
    <<: *backend-image
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
      FRONTEND_SHELL_URL: http://frontend:5173/
    volumes:
      - ./backend:/app
      - backend_public_media:/app/public-media
      - backend_private_media:/app/private-media
      - backend_quarantine:/app/quarantine
    ports:
      - '8000:8000'
    init: true
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/", timeout=2)']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    # -Q bắt buộc: settings route task sang auth-email/auth-sms/cv-export/upload-scan;
    # worker không khai queue sẽ chỉ nghe 'default' -> auth, export hoặc scan chết lặng.
    # Docker Desktop nhìn thấy toàn bộ CPU host nên Celery mặc định fork 10
    # process dù máy dev hầu như không có backlog.
    command: celery -A config worker --loglevel=info -Q default,auth-email,auth-sms,cv-export,upload-scan,candidate-email --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=200
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
    volumes:
      - ./backend:/app
      - backend_public_media:/app/public-media
      - backend_private_media:/app/private-media
      - backend_quarantine:/app/quarantine
    init: true
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully

  # Generative AI is isolated from email/export/scan workloads so provider
  # latency cannot exhaust the shared worker pool. Low prefetch keeps cancel
  # and recovery predictable; two processes keep local resource use bounded.
  ai-worker:
    <<: *backend-image
    command: celery -A config worker --loglevel=info -Q ai-generation --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=100
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
    volumes:
      - ./backend:/app
    init: true
    pids_limit: 128
    stop_grace_period: 100s
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Đối sánh CV–JD chạy local: image riêng có torch CPU + sentence-transformers
  # (Dockerfile target `ml`). Một tiến trình giữ mô hình e5-base (~1,1 GB) trong
  # RAM; mô hình đọc từ ml/models, không tải từ Internet (HF_HUB_OFFLINE).
  ml-worker:
    image: ai-recruitment-platform-ml-worker
    build:
      context: ./backend
      target: ml
    command: celery -A config worker --loglevel=info -Q ai-matching --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=500
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
      MATCHING_PRELOAD_MODEL: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    volumes:
      - ./backend:/app
      - ./ml/models:/models:ro
    mem_limit: 3g
    init: true
    pids_limit: 128
    stop_grace_period: 40s
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *backend-image
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
    volumes:
      - ./backend:/app
    init: true
    pids_limit: 64
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh /app/docker/dev-entrypoint.sh
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    environment:
      # Cùng origin để điện thoại trong LAN không gọi nhầm localhost của nó.
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://backend:8000
    init: true
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:5173/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

volumes:
  pgdata:
  backend_public_media:
  backend_private_media:
  backend_quarantine:
  clamav_db:
  frontend_node_modules:
