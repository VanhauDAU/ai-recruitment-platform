    PasswordChangeRequest:
      type: object
      description: Đặt mật khẩu lần đầu cho OAuth hoặc đổi mật khẩu của phiên hiện
        tại.
      properties:
        current_password:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
          minLength: 1
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$
          maxLength: 25
        logout_all_sessions:
          type: boolean
          default: false
      required:
      - password
    PasswordChangeResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/SessionUser'
        tokens:
          $ref: '#/components/schemas/PasswordChangeTokens'
      required:
      - detail
      - tokens
      - user
    PasswordChangeTokens:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    PasswordResetConfirm:
      type: object
      properties:
        detail:
          type: string
        role:
          type: string
      required:
      - detail
      - role
    PasswordResetConfirmRequest:
      type: object
      description: |-
        Đổi token trong link lấy mật khẩu mới. Token đã đủ vai trò xác thực nên
        không cần captcha ở bước này.
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$
          maxLength: 25
        portal:
          allOf:
          - $ref: '#/components/schemas/Portal48cEnum'
          writeOnly: true
      required:
      - password
      - token
    PasswordResetRequest:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordResetRequestPortalEnum:
      enum:
      - main
      - employer
      type: string
      description: |-
        * `main` - main
        * `employer` - employer
    PasswordResetRequestRequest:
      type: object
      description: |-
        Yêu cầu gửi link đặt lại mật khẩu. Không kiểm tra email có tồn tại hay
        không — view luôn trả cùng một thông điệp để tránh lộ danh sách email.

        ``portal`` chọn đúng tài khoản của cổng (một email có thể có tài khoản ứng
        viên và NTD riêng, mỗi bên mật khẩu riêng). Bỏ trống -> cổng ứng viên.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        captcha_token:
          type: string
          writeOnly: true
          minLength: 1
        portal:
          allOf:
          - $ref: '#/components/schemas/PasswordResetRequestPortalEnum'
          writeOnly: true
      required:
      - captcha_token
      - email
    PasswordResetValidate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
      required:
      - email
      - role
